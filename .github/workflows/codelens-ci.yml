name: CodeLens CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B clean test
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/codelens
          GITHUB_WEBHOOK_SECRET: test-secret

      - name: Build application
        run: ./mvnw -B package -DskipTests
